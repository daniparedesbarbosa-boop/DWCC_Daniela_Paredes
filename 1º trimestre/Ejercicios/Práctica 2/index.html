<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculadora de notas</title>
	<link rel="stylesheet" href="estilos.css">
</head>
<body>
	<header></header>

	<main>
		<form id="calculadora-form">
			<div class="campo">
				<label for="nota-examen">Nota del examen</label>
				<input type="number" id="nota-examen" name="nota-examen" min="0" max="10" step="0.01" required>
			</div>

			<div class="campo">
				<label for="nota-practica">Nota de la práctica</label>
				<input type="number" id="nota-practica" name="nota-practica" min="0" max="10" step="0.01" required>
			</div>

			<button type="submit">Calcular</button>
		</form>

		<p id="resultado" role="status" aria-live="polite"></p>
	</main>

	<footer></footer>

	<script src="calculadora.js"></script>
</body>
</html>
